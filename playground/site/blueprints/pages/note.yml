title: Note
num: date

icon: 📖

buttons:
  - settings
  - status

status:
  draft:
    label: Draft
    text: The note is still in draft mode. It can only be seen by editors with panel access.
  unlisted:
    label: In Review
    text: The note is online and can be visited with the direct URL. The team must still give the final go to publish it.
  listed:
    label: Published
    text: The note is online and listed in the blog

fields:
  info:
    label: Info
    type: info
    text: |
      Set note status to "In Review" to receive a push notification.
      For more information, see [Note Approval Workflow Example](https://github.com/philippoehrlein/Kirby-Push-Notifications/tree/main/examples/note-approval-workflow) on GitHub.
